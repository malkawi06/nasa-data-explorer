# Static site: the analysis runs in the visitor's browser with Pyodide (no server).
[build]
  command = "python3 web/build.py"
  publish = "web/dist"

[build.environment]
  PYTHON_VERSION = "3.11"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/nasa_explorer.zip"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
