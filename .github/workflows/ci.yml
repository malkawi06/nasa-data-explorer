name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11", extras: "geo,hdf4,astro,grib,docs,dev" }
          - { os: ubuntu-latest, python: "3.12", extras: "geo,hdf4,astro,grib,docs,dev" }
          - { os: windows-latest, python: "3.11", extras: "geo,hdf4,astro,docs,dev" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: OCR engine
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[${{ matrix.extras }}]"
      - name: Browser for UI tests
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (includes real NASA samples when reachable)
        run: pytest -q -rs

  pyodide-e2e:
    name: website on real Pyodide
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[geo,astro,docs,dev]"
          python -m playwright install --with-deps chromium
      - name: End-to-end in the browser
        env:
          E2E_PYODIDE: "1"
        run: pytest -q -rs tests/e2e/test_web_pyodide.py
