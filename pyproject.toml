[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nasa-data-explorer"
version = "0.1.0"
description = "Drop in any NASA/scientific data file, get an instant analysis report."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "xarray>=2023.6",
  "netCDF4>=1.6",
  "h5netcdf>=1.2",
  "h5py>=3.8",
  "zarr>=2.16",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "pymannkendall>=1.4",
  "jinja2>=3.1",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "pyarrow>=12",
  "pillow>=10",
  "python-dotenv>=1.0",
  "requests>=2.31",
]

[project.optional-dependencies]
geo = ["rasterio>=1.3", "rioxarray>=0.15", "geopandas>=0.14", "pyogrio>=0.7", "shapely>=2.0", "cartopy>=0.22"]
hdf4 = ["pyhdf>=0.11"]
astro = ["astropy>=5.3"]
grib = ["cfgrib>=0.9.10", "eccodes>=1.6"]
docs = ["pymupdf>=1.23", "pypdf>=4", "pdfplumber>=0.10", "python-docx>=1.0", "beautifulsoup4>=4.12", "markdown>=3.5", "pytesseract>=0.3.10"]
ai = ["anthropic>=0.40", "google-genai>=1.0", "sentence-transformers>=2.6"]
app = ["streamlit>=1.30"]
dev = ["pytest>=8", "ruff>=0.5", "nbclient>=0.10", "nbformat>=5.9", "ipykernel>=6"]
all = ["nasa-data-explorer[geo,hdf4,astro,grib,docs,ai,app]"]

[project.scripts]
nasa-explore = "nasa_explorer.cli:main"

[tool.setuptools.packages.find]
include = ["nasa_explorer*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore::RuntimeWarning"]
markers = ["network: needs internet access to NASA servers"]
